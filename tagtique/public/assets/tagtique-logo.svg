<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Metallic 24K Brushed Champagne Gold Gradient -->
    <linearGradient id="svgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C8" />
      <stop offset="25%" stop-color="#E2C17C" />
      <stop offset="65%" stop-color="#C99B41" />
      <stop offset="100%" stop-color="#966E18" />
    </linearGradient>

    <!-- Electric Cyan Pulse Gradient -->
    <linearGradient id="svgCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7FF" />
      <stop offset="50%" stop-color="#3DDCFF" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>

    <!-- Soft Neon Bloom Filter -->
    <filter id="svgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="svgDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Architectural 'T' Monogram -->
  <g transform="translate(6, 6)" filter="url(#svgDepth)">
    <path
      d="M 6 8 H 42 V 16 H 30 C 30 16 28 16 27 18 C 26 20 26 22 26 25 V 48 H 16 V 25 C 16 22 16 20 15 18 C 14 16 12 16 12 16 H 6 V 8 Z"
      fill="url(#svgGold)"
    />
    <path
      d="M 9 10 H 39 V 13 H 28 V 46 H 20 V 13 H 9 V 10 Z"
      fill="rgba(255, 255, 255, 0.25)"
    />
  </g>

  <!-- Radiating NFC Radar Waves -->
  <g transform="translate(6, 6)" fill="none" stroke="url(#svgCyan)" stroke-linecap="round" filter="url(#svgGlow)">
    <path d="M 32 30 A 8 8 0 0 1 32 44" stroke-width="2.6" />
    <path d="M 39 24 A 15 15 0 0 1 39 50" stroke-width="2.8" opacity="0.9" />
    <path d="M 46 18 A 22 22 0 0 1 46 56" stroke-width="3" opacity="0.75" />
  </g>

  <!-- Clean Wordmark: TAGTIQUE -->
  <text 
    x="68" 
    y="33" 
    fill="#FFFFFF" 
    font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="20" 
    font-weight="800" 
    letter-spacing="2"
  >TAGTIQUE</text>

  <!-- Subtext: SMART IDENTITY -->
  <text 
    x="69" 
    y="46" 
    fill="rgba(255, 255, 255, 0.55)" 
    font-family="'Space Mono', monospace, sans-serif" 
    font-size="8" 
    font-weight="700" 
    letter-spacing="2.8"
  >SMART IDENTITY</text>
</svg>
